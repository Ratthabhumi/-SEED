name: ci
permissions:
  contents: read
  actions: read

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  baselines:
    runs-on: ubuntu-latest
    outputs:
      canonical_changed: ${{ steps.scope.outputs.canonical_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: identity
        run: echo "key=$(node scripts/resolve-legacy-baselines.mjs --identity)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: scratch/legacy-baselines
          key: legacy-v2-${{ runner.os }}-${{ steps.identity.outputs.key }}
      # Always validate; a missing or rejected cache is rebuilt from pinned source.
      - run: node scripts/resolve-legacy-baselines.mjs
      - id: scope
        run: |
          if git diff --quiet origin/main...HEAD -- src/core src/content; then
            echo "canonical_changed=false" >> $GITHUB_OUTPUT
          else
            echo "canonical_changed=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-baselines-${{ github.sha }}
          path: scratch/legacy-baselines/
          if-no-files-found: error
          retention-days: 14
  render_evidence:
    needs: baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: legacy-baselines-${{ github.sha }}
          path: scratch/legacy-baselines
      - run: node scripts/measure-content153.mjs --resolved
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-evidence-${{ github.sha }}
          path: test-results/content153-performance/
          if-no-files-found: warn
          retention-days: 14
  verify:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - run: npm run zip
      - run: npm run release:verify
      - uses: actions/upload-artifact@v4
        with:
          name: seed-web-${{ steps.version.outputs.version }}-node${{ matrix.node }}
          path: release/seed-web-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/download-artifact@v4
        with:
          name: legacy-baselines-${{ github.sha }}
          path: scratch/legacy-baselines
      - run: node scripts/capture-v3-recovery.mjs self
      - run: node scripts/capture-v32-slice.mjs test-results/v36-final scratch/legacy-baselines/pr25/dist fe04927d0a03f1478cdf4b57bb4aee40a68256dd pr25
      - run: node scripts/capture-content153.mjs
      - run: node scripts/inspect-dense-boss.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v36-slice-${{ github.sha }}
          path: |
            test-results/v36-final/*-slice.webm
            test-results/v36-final/*-boss-recovery.png
            test-results/v36-final/*-beam-release.png
            test-results/v36-final/*-hunters-age-5.png
            test-results/v36-final/*-loading.png
            test-results/v36-final/*-dense-hc.png
            test-results/v36-final/*-prepared-real-world2.png
            test-results/v36-final/comparison.json
            test-results/browser/v32-*.json
            test-results/browser/v33-*.png
            test-results/browser/v35-*.json
            test-results/browser/v35-*.png
            test-results/browser/v36-*.json
            test-results/browser/v36-*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-evidence-${{ github.sha }}
          path: |
            test-results/browser/streaming-counters.json
            test-results/browser/**/*.webm
            test-results/browser/**/*.png
            test-results/browser/content153/*.json
            test-results/browser/content161-*.json
            test-results/browser/content18-*.json
            test-results/browser/overhaul-*.json
            test-results/browser/v3-*.json
            test-results/browser/v31-*.json
            test-results/browser/v32-*.json
            test-results/browser/content153/*.webm
            test-results/browser/**/trace.zip
            test-results/browser/**/error-context.md
            test-results/browser/**/frame-interval-evidence.json
            test-results/browser/dense-boss/*.json
            test-results/evolution-performance.json
            test-results/v3-comparison/
            test-results/v36-final/
          if-no-files-found: warn
          retention-days: 14

  analyze:
    needs: [verify, baselines]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run analyze
      - run: node scripts/run-progression-cohort.mjs
      - run: node scripts/run-natural-boss.mjs
        if: needs.baselines.outputs.canonical_changed == 'true'
      - name: Natural36 scope receipt
        if: needs.baselines.outputs.canonical_changed != 'true'
        run: echo 'Natural36 NOT_RUN_NO_CANONICAL_DELTA; no new cohort pass claimed.'
      - run: node scripts/run-boss-policy-experiment.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: progression-cohort-${{ github.sha }}
          path: |
            test-results/integrated-progression-cohort.json
            test-results/content153-natural-boss.json
            test-results/content18-boss-policy-experiment.json
          if-no-files-found: error
          retention-days: 14
